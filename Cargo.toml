[package]
name = "editor-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version="0.7.0" ,features = ["limit","cors"] }
uuid = { version = "1", features = ["v4","serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdkafka = "0.38"
chrono = { version = "0.4.45",features = ["serde"] }
axum-governor = "2"
tower = { version = "0.5", features = ["limit"] }
governor = "0.10.4"
rand = { version = "0.10.2",features = ["thread_rng"] }
sha2 = "0.11"
hex = "0.4"
headers = { package = "headers", version = "0.4" }
axum-extra = { version = "0.10", features = ["typed-header","cookie"] }
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
time = "0.3.55"
base64 = "0.23.1"
dotenvy = "0.15.7"
jsonwebtoken = {version = "11.0.0",features = ["rust_crypto"]}
urlencoding = "2.1.3"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }